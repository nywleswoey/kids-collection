# All four gates technical-environment.md declares — typecheck, the unit and
# property-based suite, a real production build, and the pg integration suite —
# split across two jobs: `fast-gate` needs nothing but Node, `pg-gate` needs
# Docker containers. Nothing reaches `main` without both.
#
# Why this file exists: Property-Based Testing is a *blocking* constraint carried
# from the product definition, and until now it was enforced by one person
# remembering to run `pnpm test` — 22 of the 51 test files are `*.pbt.test.ts`.
# This workflow is what turns that discipline into mechanism.
#
# This file only *supplies* checks. What makes them binding is branch protection
# on `main`, which is a repository setting rather than anything committed here.
# Until that is switched on, this workflow reports and nothing more.
#
# No secrets, deliberately. The repository is public, and every gate below still
# passes with the environment completely empty. There are exactly two `env:`
# blocks in this file and neither is a credential: an obviously-fake `.invalid`
# URL that `next build` only parses, and FC_NUM_RUNS, which makes the property
# search deeper but never makes it possible. (pg-gate has no `env:` at all — its
# connection details are committed in tests-pg/, and point at a throwaway
# container this workflow starts.) A workflow that holds no secret cannot leak
# one, which beats being careful with it. In particular NOTHING here may reach
# the production database.
name: ci

on:
  # `pull_request`, not `pull_request_target`. Two reasons, both load-bearing:
  # it checks out the *merge result* rather than the PR branch — which is the
  # thing actually being gated — and it runs without access to repository
  # secrets, the correct posture for a public repo taking outside contributions.
  pull_request:

  # Pushes to `main` are re-checked even though branch protection will mean they
  # can only arrive via a green PR. Two independently-green PRs can still merge
  # into a red `main`, and a green history on `main` is what lets a future
  # bisect trust its endpoints.
  push:
    branches: [main]

# A superseded run is abandoned on a PR and never on `main`. Those are opposite
# answers to one question, which is why both keys below are expressions rather
# than the flat literals backup.yml can afford (`group: backup`, never cancel).
# This block was deliberately absent when the file landed, because choosing
# either way needed runtimes nobody had yet; settled in #32 once they existed.
#
# The PR half is settled by those runtimes. Across all 16 successful runs of the
# CURRENT configuration (everything since #35 raised FC_NUM_RUNS), fast-gate is
# 54-103s, mean 71, and pg-gate 103-166s, mean 142. A run against a commit
# nobody will merge spends a couple of minutes of a free runner deciding
# something no one will read, and the newest push is the only one whose verdict
# can matter. Cheap to abandon, worth nothing to finish.
#
# Note the spread, which is wider than it looks like it should be: the same
# unchanged tree varies by ~2x on fast-gate and ~60% on pg-gate, entirely from
# runner variation. These figures were FIRST written here as 69-103s and
# 134-143s, from two runs, and the very next PR fell outside BOTH ranges. So
# they now carry their sample size on purpose — a range quoted from two
# observations is a guess wearing a measurement's clothes, and this file is the
# wrong place for that. Anything reasoning about CI cost should use the mean and
# expect the tail, not treat the maximum as a ceiling.
#
# `main` is the reverse: every commit there must keep its own recorded verdict.
# A cancelled run leaves a commit in history that CI never judged — the "nobody
# actually checked" hole this whole file exists to close.
#
# So for a push the group is keyed on the COMMIT, and that is deliberate rather
# than the obvious `github.ref`. `cancel-in-progress` governs only the RUNNING
# member of a group; a *pending* one is a separate rule — "By default, any
# existing pending job or workflow in the same concurrency group will be
# canceled and the new queued job or workflow will take its place" — and that
# default holds whatever the flag says. A branch-keyed group would put every
# push to `main` in one group, so three merges inside one pg-gate would cancel
# the middle commit's run while it queued, by exactly the mechanism this block
# was added to prevent. Keyed per commit the group has one possible member, so
# nothing on `main` ever queues and nothing is ever cancelled. (`queue: max`
# raises that default to 100 waiting runs, but it is rejected outright next to
# `cancel-in-progress: true`, and the PR half needs true.)
#
# What a cancellation costs is worth stating exactly, because `cancelled` is NOT
# among the successful/skipped/neutral conclusions branch protection accepts: a
# cancelled required check BLOCKS, it does not merely fail to report. In the
# ordinary case that is harmless — a `synchronize` push is itself what triggers
# the replacement run, so the run being cancelled belongs to the commit that
# just stopped being the PR head, and the rule only ever evaluates the head.
# Two cases escape that reasoning and are worth knowing rather than discovering:
#
#   `reopened` is a default `pull_request` activity type and does NOT move the
#   head, so closing and reopening mid-run cancels a run on the SHA still being
#   evaluated. It self-heals: the replacement reports the same two contexts
#   against the same SHA.
#
#   Re-running an OLDER run rejoins this group and cancels the current head's
#   run, then reports its own conclusions against the older SHA. That one does
#   not self-heal — the head is left holding two cancelled checks and the PR is
#   unmergeable until it is pushed to or re-run. Loud and recoverable, but it is
#   the reason to re-run the newest run rather than an older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. This workflow inspects the code; it never writes to the repo, posts
# a comment, or publishes a package. Narrow it here rather than relying on the
# repository default, which can be widened by someone who is not thinking about
# this file.
permissions:
  contents: read

jobs:
  # Each job id IS a check name branch protection will require (#24) — there are
  # now TWO: `fast-gate` and `pg-gate`. Neither job has a `name:` key, so there
  # is exactly one string per check to get right instead of two that can drift.
  #
  # Renaming either job silently detaches the protection rule from the check it
  # was protecting: the rule goes on waiting for a check that no longer reports,
  # and the PR sits pending forever rather than failing loudly. Treat both names
  # as published.
  fast-gate:
    runs-on: ubuntu-latest

    # The three gates together are roughly twenty seconds of real work on a
    # laptop. Ten minutes is not a performance budget, it is a hang detector —
    # this repo has already shipped one script that blocked forever waiting on
    # an interactive prompt, and a job that hangs is worse than one that fails.
    timeout-minutes: 10

    steps:
      # Action majors are the LATEST, not the oldest that works, and that is the
      # posture rather than an accident of when this was written. GitHub retires
      # the Node runtime under an action on its own schedule: everything here was
      # on the v4 line running Node 20, which GitHub had already begun
      # force-running on Node 24 with a deprecation warning on every run. A
      # required check is the worst place to discover that a forced runtime has
      # stopped being forced, because the check that would fail is the one
      # blocking the fix. Bumped in #31; re-check when a warning next appears.
      - uses: actions/checkout@v7

      # Both toolchain versions come from package.json — `engines.node` here and
      # `packageManager` for pnpm below — rather than literals in this file, so a
      # developer bumping either one does not have to remember this file exists.
      # `node-version-file: package.json` still resolves `engines.node` on v7:
      # the action checks `volta.node`, then `devEngines.runtime`, then
      # `engines.node`, and this repo sets only the last.
      #
      # Carry one caveat: `engines.node` is advisory. With no `.npmrc` setting
      # `engine-strict`, pnpm warns and exits 0 on a mismatch. It pins what CI
      # *installs*; it stops nothing.
      #
      # `package-manager-cache: false` is the one input this bump ADDED, and it
      # is deliberate rather than cargo-culted. setup-node v5 started caching
      # automatically whenever package.json has a `packageManager` field — which
      # this repo has — and for pnpm that means shelling out to pnpm to locate
      # the store, from a step that runs BEFORE pnpm is installed. v6 narrowed
      # the automatic case to npm only, so on v7 the default is already off
      # here; this says so out loud instead of resting on a third party's
      # default staying narrow. It is also just true: caching was measured and
      # rejected (see the install step below).
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      # No `version:` on purpose — the action reads `packageManager`, so the pnpm
      # running here is the exact one the developer ran. Pinning it again would
      # give the repo two answers to one question.
      #
      # Still `pnpm/action-setup` and not its successor `pnpm/setup`: that one
      # requires pnpm v11 or newer, and `packageManager` here is pnpm 10.32.1.
      # It becomes the right answer if and when this repo moves to pnpm 11.
      #
      # Note the order: setup-node runs BEFORE this, which is only safe because
      # setup-node caches nothing — no `cache:` key, and `package-manager-cache`
      # explicitly off above. Any form of pnpm-store caching shells out to pnpm
      # to locate the store, so turning one on means swapping these two steps.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # `--frozen-lockfile` turns a lockfile that disagrees with package.json
      # into a failure rather than a silent re-resolution — CI installing
      # something the developer never installed is the whole class of bug this
      # closes.
      #
      # No dependency cache, and that question is CLOSED rather than deferred.
      # The prediction when this file landed was that install would dominate the
      # job. It does not: install is 4s, and has stayed 4s across every run since
      # — of a 57s job then and a 54-103s one now (mean 71), where `build` is 30s
      # and the property search is ~20s. There is nothing there for
      # `actions/cache` to
      # win, and caching next to `--frozen-lockfile` carries its own correctness
      # risk. Reopen it against a new measurement, not against the intuition.
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Each gate below runs even when an earlier gate failed, so one red run
      # reports *every* broken gate instead of making you fix them one push at a
      # time. The job still fails: a failed step fixes the job's conclusion
      # regardless of what runs after it.
      #
      # The `steps.install.outcome` half matters as much as the `!cancelled()`
      # half. If the toolchain never came up there is nothing to gate, and three
      # cascading "command not found" failures would report a code problem that
      # does not exist. An honest gate reports the failure it actually had.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      # 321 tests across 51 files, 22 of them property-based, and 100 `fc.assert`
      # call sites. The suite still passes with every environment variable unset
      # — the one below only makes the search deeper, never makes it possible.
      #
      # 1000 is ten times fast-check's default, so this run explores ~100,000
      # cases rather than ~10,000. Property-Based Testing is a *blocking*
      # constraint (OQ-T-2), and mechanising a shallow search would close that
      # question only nominally. The runner is where depth is nearly free: nobody
      # is waiting on it, and `pg-gate` usually sets the PR's wall-clock either
      # way, so this mostly costs nothing.
      #
      # "Nearly" and "usually" are doing real work in that sentence, and they
      # replace a flat claim of ~90s of slack. The two jobs' ranges OVERLAP:
      # fast-gate is 54-103s and pg-gate 103-166s, so on an unlucky pairing —
      # slow fast-gate, fast pg-gate — this job becomes the critical path rather
      # than hiding behind it. The slack is ~70s at the means and 0s at the
      # extremes. Still the right trade for a blocking constraint, but if this
      # value is ever raised again, that is the headroom being spent, not a
      # comfortable 90s.
      #
      # Measured local cost, whole suite: unset 3.17s, 500 3.66s, 1000 4.19s,
      # 2000 5.42s, 5000 8.66s, 10000 15.33s. All green — the properties held to
      # 10,000 runs each, so raising this further is a one-line change with a
      # known price. 1000 is chosen over 10000 because most arbitraries here are
      # small and bounded (`fc.integer({min:0,max:60})`, arrays of at most 5), so
      # the tail is mostly re-sampling, and the slack is better kept for `build`.
      #
      # Reproduce any CI-only failure locally with `FC_NUM_RUNS=1000 pnpm test`.
      # A malformed value throws — see tests/setup.ts for why that matters more
      # than it looks.
      - name: Unit and property-based tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          FC_NUM_RUNS: 1000
        run: pnpm test

      # The only gate needing any environment at all, and a fake satisfies it.
      #
      # `next build` imports every page module while collecting page data — which
      # happens whether or not a route prerenders, so "every route is dynamic"
      # buys nothing — and that reaches `neon(env.databaseUrl)` at module load.
      # `neon()` only *parses* the URL there; it never opens a connection during
      # a build. So the value has to be a syntactically valid postgres URL and
      # nothing more (`not-a-url` fails; this succeeds).
      #
      # `.invalid` is reserved by RFC 2606 and can never resolve, so this value
      # cannot accidentally address a real database even if something later does
      # try to dial it. That is why it is safe to commit in the open, and why it
      # is written here rather than held as a secret.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DATABASE_URL: postgres://ci:ci@db.invalid/ci?sslmode=require
        run: pnpm build

  # The fourth declared gate: the integration suite, `pnpm test:pg` — the shared
  # store contracts run a second time against the REAL pg adapters, which is what
  # makes the Store seam more than an interface nobody tests twice.
  #
  # A SEPARATE JOB rather than three more steps on fast-gate, and the reason is
  # not wall-clock (though it does now run alongside it). It is that this job is
  # the only part of CI that depends on something outside the repository:
  # `ghcr.io/timowilhelm/local-neon-http-proxy:main`, a mutable tag in a third
  # party's personal namespace. When that breaks — and it can break with no
  # commit of ours — a separate check means the failure names itself, and
  # fast-gate stays green to say so. Folded into one job, the same outage would
  # read as "the code is broken", which is a lie of exactly the kind this
  # workflow exists to stop. (See "Not yet specified" on #17 for the standing
  # question of pinning that image by digest.)
  pg-gate:
    runs-on: ubuntu-latest

    # A hang detector, not a budget: locally this is ~55s of tests on top of ~3s
    # of container start. It is set higher than fast-gate's 10 because `pg:up`
    # waits on `until pg_isready … do sleep 0.5`, an UNBOUNDED loop — at a
    # keyboard you ctrl-C it, on a runner it would sit here until GitHub's 6-hour
    # ceiling, leaving a required check that never reports. This is the bound.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Same three setup steps as fast-gate, and deliberately not factored out:
      # a composite action or a reusable workflow would trade nine duplicated
      # lines for a second file to keep in sync, and these are the lines whose
      # whole purpose is to have one obvious answer. See fast-gate above for why
      # neither step carries a version literal, why `package-manager-cache` is
      # off, and why the action majors are the latest ones.
      #
      # The duplication has a bound, and it is checked rather than assumed: this
      # preamble appears in exactly three places (both jobs here and backup.yml),
      # it changed in all three in one commit (#31), and a mismatch between them
      # is visible in a single `grep -rn 'uses:' .github/workflows`. That is a
      # cheaper guarantee than a fourth file that can silently drift from what
      # every job actually runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm pg:up`, verbatim — NOT ported to GitHub `services:`. The compose
      # file stays the single source of truth, so `depends_on: service_healthy`
      # ordering and the migration loop come free and CI cannot drift from what
      # the developer runs. `services:` has no `depends_on` and would need the
      # migrations re-implemented here in YAML.
      #
      # ubuntu-latest needs no preparation for this: docker compose v2 is present
      # as a subcommand, and psql/pg_isready are preinstalled (verified in #19).
      #
      # There IS client/server version skew here, deliberately: the runner's
      # psql is PostgreSQL 16.x while the container is now postgres:17-alpine
      # (#26), matching production Neon's MAJOR rather than the runner's tooling.
      # The skew is harmless for what this job does. `pg_isready` performs no
      # version check at all, and `psql -f` on plain DDL is just the wire
      # protocol, which is stable across these majors — it prints its version
      # banner only when interactive, so the migration loop is not even noisy.
      # The one client that DOES refuse across majors is `pg_dump`, and this job
      # never dumps; that refusal is backup.yml's problem, and backup.yml already
      # runs its tooling from a postgres:17 image for exactly this reason.
      #
      # So the tradeoff is chosen on purpose: skew the CLIENT (which does not
      # care) rather than the SERVER (where a behavioural difference from
      # production is a real, silent risk to the contract suite's meaning).
      #
      # Its own step so that a failure here is legible as infrastructure. The
      # steps below are plain sequential — no `!cancelled()` as on fast-gate,
      # where the gates are independent. Here they are not: running the suite
      # against containers that never came up would report a wall of connection
      # errors, i.e. a code failure that did not happen.
      - name: Start Postgres and the Neon HTTP proxy
        run: pnpm pg:up

      # No env block, and none needed: tests-pg/setup.ts hardcodes both the local
      # proxy endpoint and postgres://postgres:postgres@localhost:5499/main. That
      # is a container this job just created and the runner will destroy — the
      # credentials are as public as the compose file they come from.
      #
      # 47 tests pass and 3 skip. The 3 are `it.runIf(properties)` in the shared
      # contracts, switched off by `{ properties: false }` at each tests-pg entry
      # point — the properties DO run, exhaustively, against the in-memory fake
      # in `pnpm test` over on fast-gate; running them again over HTTP round
      # trips would buy nothing but minutes. The condition is a literal in the
      # test file, not a probe of the environment, so it means exactly the same
      # thing on a runner as on a laptop. Worth being explicit about, because a
      # skip nobody looks at is how a green run stops being evidence.
      #
      # ⚠️ Known flake, recorded rather than fixed (#26): this suite will
      # occasionally stall on a single test until vitest's 30s testTimeout kills
      # it, reporting a wall-clock far longer than 30s — consistent with the
      # container host stalling, not with a slow query. It reproduced on
      # postgres:16-alpine as readily as on 17, so it is NOT a consequence of
      # the version bump, and it has never yet been seen on a runner (only on
      # local Docker Desktop). Recorded here because it is the failure mode that
      # would make this REQUIRED check go red on an unchanged tree — if that
      # happens, re-run before believing the diff caused it, and see the map
      # (#17) where the trigger to investigate properly is written down.
      - name: Integration tests against the pg adapters
        id: integration
        run: pnpm test:pg

      # The runner is destroyed with the containers on it, so the logs die with
      # them unless they are printed here. They matter because the interesting
      # failure — the proxy image moving under us — surfaces as unhelpful fetch
      # errors in the vitest output and as the actual cause in the container's.
      #
      # The condition reads "unless the suite passed", and both halves are
      # load-bearing:
      #
      #   `always()` — because exceeding `timeout-minutes` CANCELS the job, and
      #   `failure()` is false under cancellation. With `failure()` alone, the one
      #   scenario this job is bounded against (`pg:up` wedged in its unbounded
      #   `pg_isready` wait) would be the one scenario producing no logs at all.
      #   Only `always()`/`cancelled()` survive a cancellation. Note this also
      #   covers a mid-run cancellation, where `outcome` is not yet 'success'.
      #
      #   `steps.integration.outcome != 'success'` — because `always()` alone
      #   dumps the proxy's per-request INFO chatter on every GREEN run too: the
      #   first run of this job printed 5,596 lines of it after a passing suite,
      #   which buries the 47/3 line that is the actual evidence. Logs nobody
      #   needs are how the logs somebody needs get missed.
      #
      # Both compose flags match package.json's `pg:up`/`pg:down` exactly. `-p`
      # alone does find the containers, but only while the name is right:
      # `docker compose -p <unknown> logs` prints nothing and exits 0, so a
      # renamed project would quietly degrade this to a no-op. With `-f`, a moved
      # compose file fails loudly instead.
      #
      # No `pnpm pg:down`. Teardown on an ephemeral runner is ceremony: the VM is
      # discarded either way, and a cleanup step would only race this one for the
      # logs.
      - name: Container logs
        if: ${{ always() && steps.integration.outcome != 'success' }}
        run: docker compose -f tests-pg/docker-compose.yml -p kc-pgtest logs --no-color --timestamps
