# Nightly verified backup of the children's collections (Increment 23, FR10–FR16).
#
# The dump is only half of it: every run restores its own dump into a throwaway
# Postgres and asserts the result matches production exactly. A backup that is not
# verified is a belief, not a backup — so a dump that cannot be restored fails the
# run that produced it.
#
# All client tooling runs from the postgres:17 image rather than an apt-installed
# client: production is PostgreSQL 17.x and a v16 pg_dump refuses to run at all.
#
# THE UPLOADED ARTIFACT IS GPG-ENCRYPTED to a public key committed at
# .github/backup-pubkey.asc. Actions artifacts are readable by anyone with read
# access to the repository — on a public repo, every logged-in GitHub user — so
# an unencrypted dump here is a published dump. Encryption is public-key so this
# workflow can write a backup it cannot itself read; the private half is not in
# this repository and is not in CI. See docs/RESTORE.md to decrypt.
#
# The verify half is UNAFFECTED and still runs against the plaintext, which never
# leaves the runner. That ordering is deliberate: encryption is a wrapper for
# transport, and it must not become something that can make a bad dump look
# verified.
#
# Requires one repository secret:
#   BACKUP_DATABASE_URL — direct (NON-pooler) Neon endpoint for the read-only role.
#   pg_dump is unreliable against a transaction-pooling endpoint.
#
# Requires no decryption secret, deliberately — see the encrypt step.
name: backup

on:
  schedule:
    # 18:00 UTC = 02:00 SGT (UTC+8). GitHub disables scheduled workflows after
    # 60 days of repository inactivity and emails the owner — see docs/RESTORE.md.
    - cron: "0 18 * * *"
  workflow_dispatch: # on-demand dump, e.g. immediately before running anything destructive

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Bare Postgres 17 as the restore target. Migrations are deliberately NOT
      # applied — a full dump recreates the schema itself.
      restore-target:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PG_IMAGE: postgres:17-alpine
      RESTORE_URL: postgres://postgres:postgres@localhost:5433/restore
      # Every table in every schema, with its row count. No allowlist: a schema
      # added later must show up here without anyone remembering to add it.
      COUNT_SQL: >-
        SELECT n.nspname, c.relname,
               (xpath('/row/c/text()',
                 query_to_xml(format('SELECT count(*) AS c FROM %I.%I', n.nspname, c.relname),
                              false, true, '')))[1]::text::bigint
        FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog','information_schema')
          AND n.nspname NOT LIKE 'pg_toast%'
        ORDER BY 1, 2;

    steps:
      # Majors are kept level with ci.yml, and moved with it in one commit (#31)
      # — this preamble is duplicated across the two files on purpose, so two
      # different answers to "which checkout?" would be the failure mode. The
      # v4 line ran Node 20, which GitHub had already begun force-running on
      # Node 24 while warning about it on every run.
      - uses: actions/checkout@v7

      # Node version comes from `engines.node` in package.json rather than a
      # literal here, for the same reason pnpm's does below: one source of
      # truth. setup-node reads `volta.node`, then `devEngines.runtime`, then
      # `engines.node` — we only set the last. Still true on v7.
      #
      # `package-manager-cache: false` because v5 added automatic caching for
      # any package.json carrying `packageManager`, and for pnpm that shells out
      # to a pnpm that this step has not installed yet. v6 narrowed the automatic
      # case to npm, so the default is already off here — this states it rather
      # than depending on it. It matters more in this file than in ci.yml: this
      # job holds a production credential, and GitHub's own guidance is to turn
      # automatic caching off in workflows with access to sensitive information.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      # No version here on purpose: the action reads `packageManager` from
      # package.json, so the pnpm running here is the exact one the developer
      # ran. Pinning it again would give the repo two answers to one question.
      # Not the successor `pnpm/setup`, which requires pnpm v11 and this repo is
      # on 10.32.1.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - name: Pull the Postgres client image
        run: docker pull -q "$PG_IMAGE"

      # Neon free tier idle-suspends. Wake it and wait rather than failing the run:
      # a late backup is fine, a missing one is not (FR16).
      # PGURL is passed to the container BY NAME (`-e PGURL`), so the value never
      # appears on a command line or in the log. Expansion is deferred into the
      # container with `sh -c '...'` in single quotes — expanding it in the runner's
      # shell would both leak it and pass psql an empty argument.
      - name: Wake the database
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if docker run --rm -e PGURL "$PG_IMAGE" \
                 sh -c 'psql "$PGURL" -Atc "SELECT 1"' >/dev/null 2>/tmp/wake.err; then
              echo "database awake (attempt $attempt)"; exit 0
            fi
            echo "not ready yet (attempt $attempt), retrying…"
            sleep 10
          done
          echo "::error::database did not become reachable"
          sed -E 's#postgres(ql)?://[^ ]*#<redacted>#g' /tmp/wake.err || true
          exit 1
        shell: bash

      - name: Capture production row counts
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          # A real tab, via printf: POSIX sh inside the container has no $'\t'.
          docker run --rm -e PGURL -e COUNT_SQL "$PG_IMAGE" \
            sh -c 'psql "$PGURL" -At -F "$(printf "\t")" -c "$COUNT_SQL"' > prod-counts.tsv
          echo "captured $(wc -l < prod-counts.tsv) tables"
        shell: bash

      # No -t and no -n, ever. The full dump is the mechanism, not a default:
      # narrowing it means a table added by a future migration silently stops
      # being backed up, and nobody finds out until a restore.
      - name: Dump
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if ! docker run --rm -e PGURL "$PG_IMAGE" \
                 sh -c 'pg_dump "$PGURL" --no-owner --no-privileges' 2>/tmp/dump.err \
               | gzip > "dump-$(date -u +%Y%m%d).sql.gz"; then
            echo "::error::pg_dump failed"
            # pg_dump can echo the connection string on failure — redact before printing.
            sed -E 's#postgres(ql)?://[^ ]*#<redacted>#g' /tmp/dump.err
            exit 1
          fi
          ls -lh dump-*.sql.gz
        shell: bash

      # THE UPLOADED ARTIFACT IS ENCRYPTED, AND THIS STEP IS WHY THE REPOSITORY
      # CAN BE PUBLIC. An Actions artifact is downloadable by anyone with *read*
      # access to the repository, which on a public repo is every logged-in
      # GitHub user — so for as long as this workflow uploaded a plain
      # `.sql.gz`, it was publishing the children's collection data on a 90-day
      # rolling window. Nothing about the dump changed; where it can be read
      # from did.
      #
      # PUBLIC-KEY, not a shared secret, and that is the whole design. The
      # recipient key is committed in the clear at .github/backup-pubkey.asc
      # because a public key is meant to be public. The consequence is the point:
      # this runner can WRITE a backup it cannot READ. There is no decryption
      # key in CI to leak, no repository secret whose compromise would also
      # expose every past dump, and the `BACKUP_DATABASE_URL` blast radius is
      # unchanged. Symmetric encryption with a repo secret would have failed all
      # three.
      #
      # gpg rather than age or openssl, for one reason: gnupg is preinstalled on
      # ubuntu-latest and the other two are not. This job runs unattended at
      # 02:00 SGT, and an `apt-get install` or a pinned binary download is one
      # more thing that can be down at 02:00. `--recipient-file` needs no
      # keyring and no prior import, so there is no gpg state to go stale;
      # `--trust-model always` is correct here and not a shortcut, because the
      # web of trust answers "is this key who it claims" and we are not asking
      # that — the key is not fetched from anywhere, it is read out of the
      # commit being run.
      - name: Encrypt the dump
        run: |
          set -euo pipefail
          for f in dump-*.sql.gz; do
            gpg --batch --yes --trust-model always \
                --recipient-file .github/backup-pubkey.asc \
                --encrypt --output "$f.gpg" "$f"
          done

          # Three assertions, because this is the one step whose failure is
          # SILENT: a corrupt or wrongly-addressed ciphertext uploads perfectly
          # happily and is only discovered by the person who needed the backup.
          # The runner cannot decrypt (by design), so it checks what it can.
          for g in dump-*.sql.gz.gpg; do
            # 1. Non-empty.
            [ -s "$g" ] || { echo "::error::$g is empty"; exit 1; }

            # 2. Actually encrypted. Catches the plaintext ever being copied
            #    through instead of enciphered — the failure that would look
            #    exactly like success in the artifact listing.
            if gunzip -t "$g" 2>/dev/null; then
              echo "::error::$g is still gzip — it was not encrypted"; exit 1
            fi

            # 3. Addressed to a subkey of the key COMMITTED IN THIS REPO, and
            #    the run log records which one.
            #
            #    Be precise about what this does and does not buy, because the
            #    obvious reading is wrong. It does NOT catch "the pubkey was
            #    rotated and nobody kept the private half" — this step encrypts
            #    with the very file it then checks against, so that scenario
            #    produces a perfectly consistent pass. Nothing CI can see
            #    distinguishes a key you hold from one you do not; that risk is
            #    real, it is the worst one here, and it is answered by the
            #    yearly restore drill in docs/RESTORE.md, not by a runner.
            #
            #    What it does buy: proof the ciphertext went to the key in the
            #    commit rather than to something else that happened to be in the
            #    runner's keyring, and — the durable part — a line in the run
            #    log naming the key each artifact needs. Ninety days later that
            #    log is how you know which key to reach for.
            #
            #    All subkeys, not just the first: a key with two encryption
            #    subkeys (which is what rotation looks like) would otherwise
            #    fail here for no reason, since gpg picks the newest and `awk`
            #    would have picked the oldest.
            want=$(gpg --show-keys --with-colons .github/backup-pubkey.asc \
                     | awk -F: '$1=="sub"{print $5}')

            # `|| true` is load-bearing, not defensive noise. `gpg
            # --list-packets` EXITS 2 on a message it cannot decrypt, and it can
            # never decrypt this one — that is the entire point of the design.
            # It still prints the recipient packet first, which is all this
            # needs, so the status is discarded deliberately. Left unguarded
            # under `set -o pipefail`, that expected 2 kills the step *before*
            # any of the error messages below can explain why. Which is exactly
            # what it did on the first run of this step.
            gpg --list-packets "$g" >packets.txt 2>/dev/null || true
            got=$(sed -n 's/.*keyid \([0-9A-F]*\).*/\1/p' packets.txt | head -1)
            rm -f packets.txt
            [ -n "$want" ] || { echo "::error::no subkey in pubkey file"; exit 1; }
            if ! printf '%s\n' "$want" | grep -qx "$got"; then
              echo "::error::$g is addressed to $got, which is not a subkey of" \
                   "the committed public key ($(printf '%s' "$want" | tr '\n' ' '))"
              exit 1
            fi
            echo "$g → encrypted to $got, $(wc -c < "$g") bytes"
          done
        shell: bash

      # Uploads the `.gpg` ONLY. The glob matters: `dump-*.sql.gz` would match
      # the plaintext that is still on disk (the restore step below needs it),
      # so widening this pattern re-opens exactly the hole the step above
      # closes. The plaintext never leaves the runner, which is discarded.
      #
      # Bumped to v7 with the rest (#31): v4 is the same Node 20 line, and this
      # is the only step standing between a dump that exists and a dump anyone
      # can retrieve. v7 changes nothing used here — it adds an `archive:` input
      # for unzipped single-file uploads, which a `.sql.gz.gpg` does not want.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: dump-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error

      # Piped over stdin rather than bind-mounted: no volume, nothing to get the
      # host path wrong about, and the dump never lands in the container filesystem.
      - name: Restore into the throwaway database
        env:
          PGURL: ${{ env.RESTORE_URL }}
        run: |
          set -euo pipefail
          gunzip -c dump-*.sql.gz | docker run --rm -i --network host -e PGURL "$PG_IMAGE" \
            sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 -q'
        shell: bash

      - name: Read the restored row counts
        env:
          PGURL: ${{ env.RESTORE_URL }}
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGURL -e COUNT_SQL "$PG_IMAGE" \
            sh -c 'psql "$PGURL" -At -F "$(printf "\t")" -c "$COUNT_SQL"' > restored-counts.tsv
        shell: bash

      - name: Verify the backup restores exactly
        run: pnpm exec tsx scripts/backup/verify.ts prod-counts.tsv restored-counts.tsv

      # The dead-man's switch, and the ONLY thing here that can report a backup
      # which never ran. Everything else in this file reports on a run that
      # happened; this repo's whole alerting posture is "a failed run is your
      # alert", and a failed run is still a run. The gap that closes:
      #
      #   GitHub disables scheduled workflows in a PUBLIC repo after 60 days
      #   with no repository activity — and a scheduled run is NOT activity, so
      #   this workflow cannot keep itself alive. Two quiet months is ordinary
      #   for a one-parent side project. Backups stop, no run fails, nothing is
      #   emitted, and the first symptom is discovering there is no dump on the
      #   day you need one. (Disabling appears to take `workflow_dispatch` with
      #   it, so the manual "dump before doing something destructive" button
      #   goes too — reported by others, not verified here.)
      #
      # Inverting the signal is what fixes it: the monitor expects a ping on a
      # schedule and alerts on SILENCE, so it fires for every cause of "no
      # backup" at once — dormancy, a disabled workflow, a rotated
      # BACKUP_DATABASE_URL, a deleted repo, an account suspension. None of
      # those can produce a failed run to notify on.
      #
      # LAST step, and deliberately NOT `if: always()`. A ping has to mean "a
      # verified backup exists", not "the job got this far" — it is sent only
      # after the restore-and-compare above has passed, so an unrestorable dump
      # stays silent and trips the alarm exactly like a missing one.
      #
      # A failed ping does NOT fail the job. A monitoring outage must never turn
      # a good backup red, and the failure direction is already safe: if the
      # ping does not arrive, you are told. False alarm, never false calm.
      #
      # The URL is a SECRET because it is a capability, not an address —
      # whoever holds it can silence the alarm by pinging on this job's behalf,
      # which on a public repo would otherwise be anyone. It is the second
      # secret in this workflow and, unlike BACKUP_DATABASE_URL, it reaches
      # nothing: worst case is a muted alarm, never data.
      #
      # Absent secret = armed-but-not-configured, announced rather than assumed,
      # so adding this step could not break tonight's run before the check
      # exists. Setup: docs/RESTORE.md §5.
      - name: Signal the dead-man's switch
        env:
          PING_URL: ${{ secrets.BACKUP_PING_URL }}
        run: |
          set -uo pipefail
          if [ -z "${PING_URL:-}" ]; then
            echo "::warning::BACKUP_PING_URL is not set — the dead-man's switch is NOT armed."
            echo "A backup that stops running will go unnoticed. See docs/RESTORE.md §5."
            exit 0
          fi
          # --retry covers a blip in the monitor, not in the backup. -o /dev/null
          # keeps the response body out of a public log; GitHub masks the secret
          # itself, but there is no reason to print either.
          if curl -fsS -m 10 --retry 3 --retry-delay 2 -o /dev/null "$PING_URL"; then
            echo "Dead-man's switch signalled: a verified backup exists."
          else
            echo "::warning::Ping failed. The backup itself is fine and verified —"
            echo "expect an alert from the monitor, and treat it as a false alarm."
          fi
        shell: bash
