<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>Star Catchers — Admin unlock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg-0:#050310;--bg-1:#0b0826;--bg-2:#150f3d;--ink:#f7f5ff;--ink-soft:rgba(247,245,255,.72);--ink-mute:rgba(247,245,255,.55);--b1:#ffd45e;--b2:#ff6fae;--b3:#8b5cff;--b4:#43e6c8;--glass:rgba(255,255,255,.07);--brd:rgba(255,255,255,.16)}
    body{background:radial-gradient(130% 80% at 50% 0%,var(--bg-2),var(--bg-0));color:var(--ink);font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;min-height:100vh}
    .card{background:var(--glass);border:1px solid var(--brd);border-radius:1.25rem}
    .cta{background:linear-gradient(135deg,var(--b1),var(--b2));color:#2b1338;font-weight:800;border-radius:999px}
    .chip{background:var(--glass);border:1px solid var(--brd);border-radius:999px;color:var(--ink-soft)}
    .chip-on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#2b1338;border-color:transparent;font-weight:700}
    .soft{color:var(--ink-soft)} .mute{color:var(--ink-mute)}
    a{text-decoration:none}
  </style>
</head>
<body>
  <div style="background:#fde68a;color:#78350f" class="text-center py-1 text-xs font-semibold">
    🎨 MOCKUP — not functional · Generated by aidlc-discovery
  </div>

  <header style="border-bottom:1px solid var(--brd)">
    <div class="px-4 py-3 flex items-center justify-between">
      <span class="font-extrabold tracking-tight">✦ Star Catchers</span>
      <nav class="text-xs mute">Admin unlock</nav>
    </div>
  </header>

  <main class="px-4 py-6">
    <div class="text-center pt-8 pb-6">
      <div class="text-5xl mb-3">🔒</div>
      <h1 class="text-xl font-extrabold">Parent area</h1>
      <!-- source: Vision §Authentication — admin passcode gate, 20s sliding window, on top of parent sign-in -->
      <p class="soft text-sm mt-2">Enter the passcode to unlock admin.</p>
    </div>
    <div class="card p-5">
      <label for="pc" class="block text-xs mute mb-2">Passcode</label>
      <div id="pc" class="chip px-4 py-3 text-lg tracking-[0.5em] mb-4" role="textbox" aria-label="Passcode entry">••••</div>
      <a href="11-admin-dashboard.html" class="cta block text-center py-3">Enter passcode</a>
      <p class="mute text-xs mt-4 text-center">The gate closes after 20 seconds of no activity.</p>
    </div>
  </main>

  <footer class="text-xs mute text-center py-5 mt-8" style="border-top:1px solid var(--brd)">
    <a href="../user-journey.md" class="underline">View user journey</a> ·
    <a href="index.html" class="underline">All screens</a>
  </footer>
</body>
</html>
